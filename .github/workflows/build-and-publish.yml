name: Build and publish

# Compile English/Czech LaTeX and publish the same PDFs at stable release URLs.
# The portfolio links directly to them; no cross-repository token is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compile LaTeX (TeX Live container)
        run: |
          docker run --rm -v "$PWD:/work" -w /work texlive/texlive:latest \
            latexmk -pdf -interaction=nonstopmode -halt-on-error cv-en.tex cv-cz.tex
          test -s build/cv-en.pdf && test -s build/cv-cz.pdf

      - name: Retain both reviewable PDFs
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdfs
          path: |
            build/cv-en.pdf
            build/cv-cz.pdf
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Update rolling release
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cv-pdfs
          path: build

      - name: Update rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s build/cv-en.pdf && test -s build/cv-cz.pdf
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest CV" \
              --notes "Rolling release — assets are rebuilt automatically on every push to main."
          fi
          gh release upload latest build/cv-en.pdf build/cv-cz.pdf \
            --repo "$GITHUB_REPOSITORY" --clobber
